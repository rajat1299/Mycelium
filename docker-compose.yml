services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: computer_oss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d computer_oss"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
